        stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="85" y2="75" 
        stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="65" x2="85" y2="75" 
        stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
</svg>
