  <!-- U estilizado -->
  <path d="M40 30 V80 A30 30 0 0 0 100 80 V30" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- Nós internos (representando grupos/eventos) -->
